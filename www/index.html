<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#8b2252">
  <meta name="description" content="CycleCare — Application de suivi du cycle menstruel">
  <title>CycleCare</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <div id="splash" class="splash">
      <div class="splash-inner">
        <img src="icon.svg" class="splash-logo" alt="" width="84" height="84">
        <div class="splash-name">CycleCare</div>
        <div class="splash-loader"></div>
      </div>
    </div>
    <div id="view"></div>
    <div id="modal-root"></div>
  </div>
  <div id="toast" class="toast"></div>

  <!-- Supabase (doit être chargé en premier) -->
  <!-- Version figée + empreinte SRI : un CDN compromis ne peut pas injecter de code -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>

  <!-- Application — ordre d'inclusion critique -->
  <script src="js/supabase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cycle.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/router.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/files.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/report.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/daylog.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
